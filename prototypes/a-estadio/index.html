<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="color-scheme" content="dark light">
<title>vic-fut · Estadio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app" data-theme="dark">
  <div class="atmos" aria-hidden="true">
    <div class="atmos-grad"></div>
    <div class="flood flood-l"></div>
    <div class="flood flood-r"></div>
    <div class="atmos-grain"></div>
  </div>

  <header class="topbar" id="topbar">
    <button class="club-pill" id="clubPill" type="button" aria-haspopup="dialog" aria-controls="teamSheet">
      <span class="mono" id="pillMono" aria-hidden="true"></span>
      <span class="club-pill-txt">
        <span class="club-pill-kick">Tu club</span>
        <span class="club-pill-name" id="pillName"></span>
      </span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="topbar-right">
      <span class="demo-badge" id="demoBadge" hidden>DATOS DEMO</span>
      <button class="icon-btn" type="button" id="bellBtn" aria-label="Notificaciones">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15L6 16zM10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="screens" id="screens">
    <section class="screen" id="scr-home" data-screen="home" aria-label="Inicio"></section>
    <section class="screen" id="scr-matches" data-screen="matches" aria-label="Partidos" hidden></section>
    <section class="screen screen-history" id="scr-history" data-screen="history" aria-label="Historia" hidden></section>
    <section class="screen" id="scr-season" data-screen="season" aria-label="Temporada" hidden></section>
    <section class="screen" id="scr-more" data-screen="more" aria-label="Más" hidden></section>
  </main>

  <!-- Vista de partido (se apila sobre la pestaña activa) -->
  <section class="detail" id="detail" aria-label="Detalle del partido" hidden></section>

  <nav class="tabbar" id="tabbar" aria-label="Navegación principal">
    <button type="button" class="tab" data-tab="home" aria-label="Inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Inicio</span>
    </button>
    <button type="button" class="tab" data-tab="matches" aria-label="Partidos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Partidos</span>
    </button>
    <button type="button" class="tab tab-center" data-tab="history" aria-label="Historia">
      <span class="tab-orb">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z" fill="currentColor"/></svg>
      </span>
      <span>Historia</span>
    </button>
    <button type="button" class="tab" data-tab="season" aria-label="Temporada">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M10 20V7M15 20v-5M20 20V4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Temporada</span>
    </button>
    <button type="button" class="tab" data-tab="more" aria-label="Más">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18.5" cy="12" r="1.8" fill="currentColor"/></svg>
      <span>Más</span>
    </button>
  </nav>

  <!-- Hojas inferiores -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="teamSheet" role="dialog" aria-modal="true" aria-labelledby="teamSheetTitle" hidden>
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="teamSheetTitle">Elige tu club</h2>
      <button type="button" class="icon-btn sheet-x" data-close aria-label="Cerrar">✕</button>
    </div>
    <div class="team-list" id="teamList"></div>
  </div>
  <div class="sheet" id="playerSheet" role="dialog" aria-modal="true" aria-labelledby="playerSheetTitle" hidden></div>

  <div class="theme-wipe" id="themeWipe" aria-hidden="true"><span class="theme-wipe-mono" id="wipeMono"></span></div>
  <div class="goal-burst" id="goalBurst" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="../../shared/teams.js"></script>
<script src="app.js"></script>
</body>
</html>
